<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow's Push to Think Trivia — Online room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--studio:#161a52;--studio-2:#232a86;--studio-3:#2f38a8;--edge:#4a55d6;--marquee:#ffc53d;--hot:#ff3d8b;--go:#1fd6a8;--bust:#ff5a4e;--paper:#f6f3ff;--muted:#aab0e8;--ink:#141747;--display:'Bungee','Impact',sans-serif;--body:'Rubik',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0f3c;color:var(--paper);font-family:var(--body)}
#viewport{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 18%,#2d35a0,#161a52 55%,#0b0d36)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:700;background:var(--studio-3);box-shadow:inset 0 0 0 2px var(--edge)}
.btn.primary{background:var(--marquee);color:var(--ink);font-size:20px;padding:14px 28px;box-shadow:0 5px 0 #b8860b}
.btn:disabled{opacity:.4;cursor:default}
.hud{position:absolute;left:28px;right:28px;top:16px;height:48px;display:flex;align-items:center;gap:16px}
.logo{font-family:var(--display);font-size:22px;color:var(--marquee)}
.pill{background:var(--studio-2);border:2px solid var(--edge);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:700}
.spacer{flex:1}
.code{font-family:var(--display);font-size:34px;color:var(--marquee);letter-spacing:6px}
.board{position:absolute;left:28px;top:80px;width:912px;min-height:300px;border-radius:26px;padding:26px 32px;background:linear-gradient(180deg,var(--studio-2),#1a1f6e);box-shadow:inset 0 0 0 3px var(--edge),0 18px 40px rgba(5,7,40,.5)}
.chips{display:flex;gap:10px;margin-bottom:14px}
.chip{font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;background:rgba(246,243,255,.1)}
.chip.easy{background:var(--go);color:var(--ink)}.chip.medium{background:var(--marquee);color:var(--ink)}.chip.hard{background:var(--hot)}
.qtext{font-size:34px;line-height:1.25;font-weight:700;margin:0 0 18px}
.qtext.small{font-size:26px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;border:3px solid var(--edge);border-radius:16px;background:rgba(35,42,134,.6);padding:12px 16px;font-size:21px;font-weight:700}
.opt .k{flex:none;width:40px;height:40px;border-radius:50%;background:var(--marquee);color:var(--ink);display:grid;place-items:center;font-family:var(--display)}
.opt.right{background:var(--go);color:var(--ink);border-color:#aff5e3}
.fuse{position:absolute;left:28px;top:auto;width:912px;height:12px;border-radius:6px;background:rgba(246,243,255,.12);overflow:hidden}
.fuse i{display:block;height:100%;background:linear-gradient(90deg,var(--marquee),#ffdf7e);width:100%}
.fuse.warn i{background:linear-gradient(90deg,#ff9f1c,var(--marquee))}
.fuse.danger i{background:linear-gradient(90deg,var(--bust),#ff8a5b)}
.side{position:absolute;right:28px;top:80px;width:300px}
.side h2{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--studio-2);box-shadow:inset 0 0 0 2px var(--edge);margin-bottom:8px;font-size:18px}
.prow.buzzed{background:#3a2f80;box-shadow:inset 0 0 0 2px var(--marquee)}
.prow.out{opacity:.5}
.prow .s{font-family:var(--display);font-size:20px}
.prow .s.neg{color:var(--bust)}
.join{position:absolute;left:28px;bottom:26px;width:912px;display:flex;align-items:center;gap:18px;font-size:17px;color:var(--muted)}
.join b{color:var(--paper)}
.controls{position:absolute;left:28px;bottom:70px;display:flex;gap:12px}
.banner{position:absolute;left:28px;top:80px;width:912px;border-radius:26px;padding:22px 32px;background:linear-gradient(180deg,#2a0f4f,#1b1060);box-shadow:inset 0 0 0 4px var(--hot)}
.banner h1{font-family:var(--display);font-size:46px;margin:0 0 6px;color:var(--marquee)}
.banner p{margin:0;font-size:19px;color:var(--muted)}
.buzzline{font-size:24px;font-weight:800;color:var(--marquee);min-height:32px;margin-top:8px}
.fact{margin-top:14px;background:rgba(246,243,255,.08);border-left:6px solid var(--go);border-radius:12px;padding:12px 16px;font-size:18px;line-height:1.4}
.fact b{display:block;color:var(--go);font-size:16px;margin-bottom:4px}
.fact a{color:#b9befa;font-size:13px}
.setup{position:absolute;left:28px;top:290px;width:912px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field select,.field input{font:500 17px var(--body);color:var(--paper);background:var(--studio-2);border:2px solid var(--edge);border-radius:12px;padding:9px 12px;min-width:150px;max-width:230px}
.hide{display:none!important}
.bgrid{position:absolute;left:28px;top:80px;width:912px;display:grid;gap:8px}
.bcat{height:56px;display:grid;place-items:center;text-align:center;padding:4px 6px;border-radius:12px;background:#2a0f4f;box-shadow:inset 0 0 0 3px var(--hot);font-weight:800;font-size:14px;line-height:1.15}
.btile{height:74px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:14px;background:var(--studio-2);font-family:var(--display);font-size:26px;color:var(--marquee)}
.btile.done{opacity:.12}
.turnline{position:absolute;left:28px;top:auto;bottom:120px;width:912px;font-size:26px;font-weight:800;color:var(--marquee)}
.err{position:absolute;left:28px;top:640px;color:var(--bust);font-weight:700}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="hud">
    <span class="logo">Snow's Push to Think Trivia</span>
    <span class="pill" id="phasePill">Lobby</span>
    <span class="spacer"></span>
    <span class="pill" id="connPill">connecting…</span>
    <span class="code" id="codeLabel"></span>
  </div>

  <div class="side">
    <h2>Players</h2>
    <div id="players"></div>
  </div>

  <!-- lobby -->
  <div id="lobby">
    <div class="banner">
      <h1>Room <span id="bigCode"></span></h1>
      <p>Players join from their phones and buzz from their own device. Whoever created the room starts it from there.</p>
    </div>
    <div class="setup">
      <label class="field">Read questions aloud<select id="speak"><option value="0" selected>Off (recommended for online)</option><option value="1">On</option></select></label>
    </div>
  </div>

  <!-- play -->
  <div id="boardView" class="hide">
    <div class="bgrid" id="bgrid"></div>
    <div class="turnline" id="turnline"></div>
  </div>
  <div id="play" class="hide">
    <div class="board">
      <div class="chips" id="chips"></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="buzzline" id="buzzline"></div>
      <div class="fact hide" id="fact"></div>
    </div>
    <div class="fuse hide" id="fuse" style="top:640px"><i id="fuseFill"></i></div>
  </div>

  <div class="join" id="joinLine"></div>
  <div class="controls"><span class="pill" id="viewNote">View only — players control the game from their phones</span></div>
  <div class="err" id="err"></div>
</div></div>

<script type="module">
// Point this at your deployed Worker, or pass ?server=... in the URL.
const DEFAULT_SERVER = 'https://push-to-think.rishab-kharidhi.workers.dev';
const qs = new URLSearchParams(location.search);
const server = (qs.get('server') || localStorage.getItem('ptt.server') || DEFAULT_SERVER).replace(/\/$/, '');
if (qs.get('server')) localStorage.setItem('ptt.server', qs.get('server'));
const $ = s => document.querySelector(s);
const LETTERS = ['A', 'B', 'C', 'D'];

function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

let ws, code = (qs.get('room') || '').toUpperCase(), pid = localStorage.getItem('ptt.hostpid') || '';
let offset = 0, bestRtt = Infinity, deadline = 0, shownAt = 0, timerId = null, players = [], buzzedId = null;
if (!pid) { pid = 'host-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('ptt.hostpid', pid); }
const roomNow = () => Date.now() + offset;
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify(o));

(async function boot() {
  try {
    if (!code) { const r = await fetch(server + '/new'); code = (await r.json()).code; }
  } catch { $('#err').textContent = 'Could not reach the room server. Check the ?server= address.'; return; }
  // A screen never controls the room, so it is safe to leave open on a stream.
  history.replaceState({}, '', `?room=${code}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : ''));
  $('#codeLabel').textContent = code; $('#bigCode').textContent = code;
  const playUrl = location.href.replace(/online\.html.*$/, 'play.html') + `?room=${code}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : '');
  $('#joinLine').innerHTML = `Join from your phone at <b>${playUrl.replace(/^https?:\/\//, '')}</b> &nbsp; room code <b>${code}</b>`;
  connect();
})();

function connect() {
  ws = new WebSocket(server.replace(/^http/, 'ws') + `/r/${code}/ws?role=screen&name=Screen&pid=${pid}`);
  ws.onopen = () => { setConn('live'); syncClock(); setInterval(syncClock, 15000); };
  ws.onclose = () => { setConn('reconnecting…'); setTimeout(connect, 1200); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
const setConn = t => $('#connPill').textContent = t;
function syncClock() { for (let i = 0; i < 4; i++) setTimeout(() => send({ t: 'ping', c: Date.now() }), i * 120); }



function handle(m) {
  if (m.t === 'pong') { const now = Date.now(), rtt = now - m.c; if (rtt < bestRtt) { bestRtt = rtt; offset = m.s + rtt / 2 - now; } return; }
  if (m.t === 'welcome' || m.t === 'state') { players = m.state.players; renderPlayers(); return; }
  if (m.t === 'players') { players = m.players; renderPlayers(); return; }
  if (m.t === 'board') return onBoard(m);
  if (m.t === 'wager') { $('#turnline').textContent = `${m.name} found a Double Down — wagering up to ${m.max}…`; return; }
  if (m.t === 'wagered') { $('#turnline').textContent = `${m.name} wagers ${m.amount}.`; return; }
  if (m.t === 'question') return onQuestion(m);
  if (m.t === 'buzzing') { $('#buzzline').textContent = `${m.name} buzzed in…`; buzzedId = m.id; renderPlayers(); return; }
  if (m.t === 'locked') { $('#buzzline').textContent = `${m.name} is answering…`; buzzedId = m.id; renderPlayers(); stopTimer(); return; }
  if (m.t === 'wrong') { $('#buzzline').textContent = `${m.name} got it wrong (${m.delta})`; players = m.scores; buzzedId = null; renderPlayers(); return; }
  if (m.t === 'reopen') { deadline = m.deadline; $('#buzzline').textContent = 'Open to everyone else!'; startTimer(); return; }
  if (m.t === 'reveal') return onReveal(m);
  if (m.t === 'over') return onOver(m);
  if (m.t === 'error') { $('#err').textContent = m.msg; return; }
}

function onBoard(m) {
  $('#lobby').classList.add('hide'); $('#play').classList.add('hide'); $('#boardView').classList.remove('hide');
  $('#phasePill').textContent = 'Board';
  const grid = $('#bgrid'); grid.textContent = '';
  grid.style.gridTemplateColumns = `repeat(${m.board.cats.length}, 1fr)`;
  m.board.cats.forEach(c => { const d = document.createElement('div'); d.className = 'bcat'; d.textContent = c.replace(/^(Entertainment|Science): /, ''); grid.appendChild(d); });
  m.board.grid.forEach(row => row.forEach(t => {
    const d = document.createElement('div'); d.className = 'btile' + (t.done ? ' done' : '');
    d.textContent = t.done ? '' : t.value; grid.appendChild(d);
  }));
  $('#turnline').textContent = `${m.turnName} is picking…`;
  if (m.scores) { players = m.scores; renderPlayers(); }
}

function onQuestion(m) {
  $('#lobby').classList.add('hide'); $('#boardView').classList.add('hide'); $('#play').classList.remove('hide');
  if (m.mode === 'board') $('#phasePill').textContent = `${m.ownerName}'s tile for ${m.value}${m.dd ? ' (Double Down)' : ''}`;
  else $('#phasePill').textContent = `Question ${m.round}${m.rounds ? ' of ' + m.rounds : ''}`;
  $('#err').textContent = ''; $('#fact').classList.add('hide');
  $('#buzzline').textContent = '';
  buzzedId = null; renderPlayers();
  const q = m.question;
  $('#chips').innerHTML = '';
  [[q.category, ''], [q.difficulty[0].toUpperCase() + q.difficulty.slice(1), q.difficulty]].forEach(([txt, cls]) => {
    const s = document.createElement('span'); s.className = 'chip ' + cls; s.textContent = txt; $('#chips').appendChild(s);
  });
  $('#qtext').textContent = q.text;
  $('#qtext').className = 'qtext' + (q.text.length > 120 ? ' small' : '');
  const box = $('#opts'); box.textContent = '';
  q.options.forEach((o, i) => {
    const d = document.createElement('div'); d.className = 'opt'; d.dataset.i = i;
    const k = document.createElement('span'); k.className = 'k'; k.textContent = LETTERS[i];
    const t = document.createElement('span'); t.textContent = o;
    d.append(k, t); box.appendChild(d);
  });
  shownAt = m.shownAt; deadline = m.deadline;
  setTimeout(() => { $('#fuse').classList.remove('hide'); startTimer(); speak(q.text, q.options); }, Math.max(0, shownAt - roomNow()));
}
function startTimer() {
  stopTimer();
  const span = deadline - roomNow();
  timerId = setInterval(() => {
    const left = deadline - roomNow(), f = Math.max(0, Math.min(1, left / span));
    $('#fuseFill').style.width = (f * 100) + '%';
    $('#fuse').className = 'fuse' + (left <= 5000 ? ' danger' : left <= 10000 ? ' warn' : '');
    if (left <= 0) stopTimer();
  }, 80);
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function onReveal(m) {
  stopTimer(); $('#fuse').classList.add('hide');
  [...document.querySelectorAll('.opt')].forEach((o, i) => { if (i === m.correctIdx) o.classList.add('right'); });
  $('#buzzline').textContent = m.winner ? `${m.winner.name} got it, +${m.winner.delta}` : `Nobody got it. The answer was ${m.correct}.`;
  players = m.scores; buzzedId = null; renderPlayers();
  if (m.explain) {
    const f = $('#fact'); f.classList.remove('hide'); f.textContent = '';
    const b = document.createElement('b'); b.textContent = `Why it's ${m.correct}`;
    const p = document.createElement('div'); p.textContent = m.explain;
    f.append(b, p);
    if (m.source?.url) { const a = document.createElement('a'); a.href = m.source.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = `Wikipedia: ${m.source.title} (CC BY-SA)`; f.append(a); }
    speak(m.explain);
  } else speak(m.winner ? `${m.winner.name} got it.` : `The answer was ${m.correct}.`);
}
function onOver(m) {
  stopTimer(); $('#fuse').classList.add('hide');
  $('#play').classList.add('hide'); $('#boardView').classList.add('hide'); $('#lobby').classList.remove('hide');
  $('#phasePill').textContent = 'Final scores';
  players = m.scores; renderPlayers();
  const top = m.scores[0];
  $('#bigCode').textContent = code;
  document.querySelector('.banner p').textContent = top ? `${top.name} wins with ${top.score} points! Start another round when you're ready.` : 'Game over.';
  speak(top ? `${top.name} wins with ${top.score} points!` : 'Game over.');

}
function renderPlayers() {
  const box = $('#players'); box.textContent = '';
  players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'prow' + (p.id === buzzedId ? ' buzzed' : '') + (p.connected ? '' : ' out');
    const n = document.createElement('span'); n.textContent = p.name;
    const s = document.createElement('span'); s.className = 's' + (p.score < 0 ? ' neg' : ''); s.textContent = p.score;
    row.append(n, s); box.appendChild(row);
  });
  if (!players.length) box.innerHTML = '<div class="prow" style="opacity:.6">Waiting for players…</div>';
}
// Off by default in online games: everyone reads the question on their own device, and a voice
// reading it out just makes the shared screen feel behind. Flip the toggle if you want it.
function speak(text, options) {
  if ($('#speak').value !== '1' || !('speechSynthesis' in window)) return;
  const say = options ? `${text} ${options.map((o, i) => `${LETTERS[i]}: ${o}.`).join(' ')}` : text;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.rate = 1.05;
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
