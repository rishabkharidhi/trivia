<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push to Think — Multiplayer screen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Multiplayer wears a lilac palette so it never looks like the single-screen game. */
:root{
  --studio:#2a1355;--studio-2:#3b2170;--studio-3:#4c2c8c;--edge:#8357d6;--soft:#b79cff;
  --marquee:#ffc53d;--hot:#ff5fae;--go:#39e6c3;--bust:#ff6b6b;--paper:#f7f3ff;--muted:#bda9ee;--ink:#1b0f36;
  --display:'Bungee','Impact',sans-serif;--body:'Rubik',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#150a2e;color:var(--paper);font-family:var(--body)}
#viewport{position:fixed;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 12%,#5b34a8 0%,#2a1355 55%,#150a2e 100%)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center}
.hud{position:absolute;left:28px;right:28px;top:16px;height:48px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--display);font-size:21px;color:var(--soft)}
.pill{background:var(--studio-2);border:2px solid var(--edge);border-radius:999px;padding:6px 16px;font-size:16px;font-weight:700}
.pill.live{border-color:var(--go)}
.spacer{flex:1}
.code{font-family:var(--display);font-size:32px;color:var(--marquee);letter-spacing:6px}

/* host */
#host{position:absolute;left:24px;top:78px;width:280px}
#telly{display:block;margin:0 auto;height:196px;width:auto}
#telly .qm-bob,#telly .qm-pose,#telly .shape-bang,#telly .eyes,#telly .qm-dot{transform-box:view-box}
#telly .shape-bang,#telly .e-happy,#telly .e-sad,#telly .e-wide,#telly .m-grin,#telly .m-frown,#telly .m-o,#telly .m-talk,#telly .drops{display:none}
#host.mood-happy .shape-q{display:none}
#host.mood-happy .shape-bang{display:inline;transform-origin:120px 190px;animation:bang .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bang{from{transform:scale(.6,.4)}to{transform:scale(1)}}
#host.mood-happy .e-open{display:none} #host.mood-happy .e-happy{display:inline}
#host.mood-happy .m-smile{display:none} #host.mood-happy .m-grin{display:inline}
#host.mood-sad .e-open{display:none} #host.mood-sad .e-sad{display:inline}
#host.mood-sad .m-smile{display:none} #host.mood-sad .m-frown{display:inline}
#host.mood-sad .qm-pose{transform-origin:120px 230px;transform:rotate(-16deg) translate(-8px,16px) scaleY(.92);transition:transform .45s ease}
#host.mood-confused .e-open{display:none} #host.mood-confused .e-wide{display:inline}
#host.mood-confused .m-smile{display:none} #host.mood-confused .m-o{display:inline}
#host.mood-confused .qm-pose{transform-origin:120px 230px;animation:tilt 1.1s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#telly .qm-pose{transition:transform .35s ease}
#host.talking .m-smile,#host.talking .m-grin,#host.talking .m-frown,#host.talking .m-o{display:none}
#host.talking .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:yap .17s ease-in-out infinite alternate}
#host.talking .qm-bob{animation:bob .34s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes yap{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#telly .eyes{transform-origin:120px 48px;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#telly .qm-dot{transform-origin:120px 276px}
#host.talking .qm-dot{animation:squish .34s ease-in-out infinite alternate}
@keyframes squish{from{transform:scale(1,1)}to{transform:scale(1.08,.9)}}
#host.sweat .drops{display:inline;animation:drip .6s ease-in infinite}
@keyframes drip{from{transform:translateY(-2px);opacity:1}to{transform:translateY(8px);opacity:.2}}
#host.sweat .qm-bob{animation:jitter .12s linear infinite}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}

#bubble{position:relative;margin-top:14px;background:var(--paper);color:var(--ink);border-radius:18px;padding:13px 16px;font-size:18px;line-height:1.35;font-weight:500;min-height:64px;max-height:150px;overflow:hidden;box-shadow:0 10px 30px rgba(15,5,40,.5)}
#bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:var(--paper)}
#bubble .who{display:block;font-size:12px;font-weight:700;color:var(--hot);margin-bottom:2px}

/* centre panel */
.panel{position:absolute;left:318px;top:78px;width:660px;min-height:330px;border-radius:24px;padding:22px 26px;background:linear-gradient(180deg,var(--studio-2),#2b1859);box-shadow:inset 0 0 0 3px var(--edge),0 18px 40px rgba(10,4,30,.55)}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(247,243,255,.12)}
.chip.easy{background:var(--go);color:var(--ink)}.chip.medium{background:var(--marquee);color:var(--ink)}.chip.hard{background:var(--hot)}
.qtext{font-size:29px;line-height:1.25;font-weight:700;margin:0 0 16px}
.qtext.small{font-size:23px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid var(--edge);border-radius:14px;background:rgba(75,44,140,.55);padding:11px 14px;font-size:19px;font-weight:700}
.opt .k{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.opt.right{background:var(--go);color:var(--ink);border-color:#a9f6e6}
.fact{margin-top:14px;background:rgba(247,243,255,.08);border-left:5px solid var(--go);border-radius:12px;padding:11px 14px;font-size:17px;line-height:1.4}
.fact b{display:block;color:var(--go);font-size:15px;margin-bottom:3px}
.fact a{color:var(--soft);font-size:13px}
.fuse{position:absolute;left:318px;width:660px;height:12px;border-radius:6px;background:rgba(247,243,255,.14);overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--soft),#e7ddff)}
.fuse.warn i{background:linear-gradient(90deg,var(--marquee),#ffdf7e)}
.fuse.danger i{background:linear-gradient(90deg,var(--bust),#ff9c9c)}

/* board grid */
.bgrid{position:absolute;left:318px;top:78px;width:640px;display:grid;gap:8px}
.bcat{height:60px;display:grid;place-items:center;text-align:center;padding:4px;border-radius:11px;background:#43106b;box-shadow:inset 0 0 0 3px var(--hot);font-weight:800;font-size:13px;line-height:1.15}
.btile{height:86px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:12px;background:var(--studio-3);font-family:var(--display);font-size:22px;color:var(--marquee)}
.btile.done{opacity:.13}
.turnline{position:absolute;left:318px;width:640px;text-align:center;font-size:24px;font-weight:800;color:var(--marquee)}

/* players */
.side{position:absolute;right:24px;top:78px;width:272px}
.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--studio-2);box-shadow:inset 0 0 0 2px var(--edge);margin-bottom:8px;font-size:18px}
.prow.buzzed{background:#5a2c9c;box-shadow:inset 0 0 0 2px var(--marquee)}
.prow.turn{box-shadow:inset 0 0 0 2px var(--go)}
.prow.out{opacity:.45}
.prow .s{font-family:var(--display);font-size:19px}
.prow .s.neg{color:var(--bust)}

.join{position:absolute;left:24px;right:24px;bottom:20px;display:flex;align-items:center;gap:16px;font-size:16px;color:var(--muted)}
.join b{color:var(--paper)}
.lobby{position:absolute;left:318px;top:78px;width:660px;border-radius:24px;padding:26px 30px;background:linear-gradient(180deg,#43106b,#2b1859);box-shadow:inset 0 0 0 4px var(--hot)}
.lobby h1{font-family:var(--display);font-size:40px;margin:0 0 8px;color:var(--marquee)}
.lobby p{margin:0;font-size:18px;color:var(--muted);line-height:1.45}
.setup{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(247,243,255,.1)}
.hide{display:none!important}
.err{position:absolute;left:318px;bottom:60px;color:var(--bust);font-weight:700}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="hud">
    <span class="logo">Push to Think — Multiplayer</span>
    <span class="pill" id="phasePill">Lobby</span>
    <span class="spacer"></span>
    <span class="pill" id="connPill">connecting…</span>
    <span class="code" id="codeLabel"></span>
  </div>

  <div id="host" class="mood-neutral">
    <svg id="telly" viewBox="0 0 240 300" role="img" aria-label="Fae N'Lancer, the game host">
      <ellipse class="shadow" cx="120" cy="288" rx="34" ry="7" fill="#070930" opacity=".5"/>
      <g class="qm-bob"><g class="qm-pose">
        <g class="shape-q">
          <path d="M68 100 C68 38 172 38 172 100 C172 140 120 140 120 185" fill="none" stroke="#c4175e" stroke-width="54" stroke-linecap="round"/>
          <path d="M68 100 C68 38 172 38 172 100 C172 140 120 140 120 185" fill="none" stroke="#ff3d8b" stroke-width="44" stroke-linecap="round"/>
          <path d="M80 82 C88 56 116 46 140 50" fill="none" stroke="#ffd1e4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        </g>
        <g class="shape-bang">
          <rect x="82" y="18" width="76" height="176" rx="38" fill="#c4175e"/>
          <rect x="87" y="23" width="66" height="166" rx="33" fill="#ff3d8b"/>
          <path d="M98 40 L98 100" stroke="#ffd1e4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        </g>
        <g class="face" transform="translate(120 56) scale(1.22) translate(-120 -56)">
          <g class="eyes">
            <g class="e-open"><ellipse cx="108" cy="48" rx="6.5" ry="8.5" fill="#141747"/><ellipse cx="132" cy="48" rx="6.5" ry="8.5" fill="#141747"/><circle cx="110" cy="45" r="2.2" fill="#fff"/><circle cx="134" cy="45" r="2.2" fill="#fff"/></g>
            <g class="e-happy"><path d="M101 51 Q108 40 115 51" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M125 51 Q132 40 139 51" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>
            <g class="e-sad"><path d="M101 46 Q108 54 115 48" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M125 48 Q132 54 139 46" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>
            <g class="e-wide"><circle cx="107" cy="47" r="9" fill="#fff"/><circle cx="133" cy="47" r="9" fill="#fff"/><circle cx="107" cy="47" r="3.5" fill="#141747"/><circle cx="133" cy="47" r="3.5" fill="#141747"/></g>
          </g>
          <path class="m-smile" d="M110 63 Q120 73 130 63" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path class="m-grin" d="M107 61 Q120 80 133 61 Z" fill="#141747"/>
          <path class="m-frown" d="M110 70 Q120 61 130 70" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <ellipse class="m-o" cx="120" cy="67" rx="5" ry="6.5" fill="#141747"/>
          <ellipse class="m-talk" cx="120" cy="66" rx="8" ry="6" fill="#141747"/>
          <g class="drops"><path d="M150 36 q5 8 0 12 q-5 -4 0 -12z" fill="#9fd8ff"/><path d="M88 56 q4 7 0 10 q-4 -3 0 -10z" fill="#9fd8ff"/></g>
        </g>
        <g class="bowtie"><path d="M120 178 L100 168 L100 190 Z M120 178 L140 168 L140 190 Z" fill="#ffc53d"/><circle cx="120" cy="179" r="5" fill="#e0a520"/></g>
      </g></g>
      <g class="qm-dot"><circle cx="120" cy="252" r="24" fill="#c4175e"/><circle cx="120" cy="252" r="19" fill="#ff3d8b"/><circle cx="113" cy="245" r="5" fill="#ffd1e4" opacity=".7"/></g>
    </svg>
    <div id="bubble"><span class="who">Fae N'Lancer</span><span id="bubbleText">Waiting for players…</span></div>
  </div>

  <div class="side"><h2>Players</h2><div id="players"></div></div>

  <div class="lobby" id="lobbyPanel">
    <h1>Room <span id="bigCode"></span></h1>
    <p id="lobbyText">Players join from their own devices. Whoever created the room starts the game from theirs.</p>
    <div class="setup" id="setupTags"></div>
  </div>

  <div class="bgrid hide" id="bgrid"></div>
  <div class="turnline hide" id="turnline" style="top:520px"></div>

  <div class="panel hide" id="panel">
    <div class="chips" id="chips"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="fact hide" id="fact"></div>
  </div>
  <div class="fuse hide" id="fuse" style="top:426px"><i id="fuseFill"></i></div>

  <div class="join" id="joinLine"></div>
  <div class="err" id="err"></div>
</div></div>

<script type="module">
const DEFAULT_SERVER = 'https://push-to-think.rishab-kharidhi.workers.dev';
const qs = new URLSearchParams(location.search);
const server = (qs.get('server') || localStorage.getItem('ptt.server') || DEFAULT_SERVER).replace(/\/$/, '');
if (qs.get('server')) localStorage.setItem('ptt.server', qs.get('server'));
const $ = s => document.querySelector(s);
const LETTERS = ['A', 'B', 'C', 'D'];
function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

let ws, code = (qs.get('room') || '').toUpperCase(), pid = localStorage.getItem('ptt.hostpid') || '';
let offset = 0, bestRtt = Infinity, deadline = 0, shownAt = 0, timerId = null, players = [], highlight = null, turnId = null, settings = {};
if (!pid) { pid = 'screen-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('ptt.hostpid', pid); }
const roomNow = () => Date.now() + offset;
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify(o));
function setMood(m) { const h = $('#host'); h.className = ''; h.classList.add('mood-' + m); }
function bubble(t) { $('#bubbleText').textContent = t; }

(async function boot() {
  try { if (!code) { const r = await fetch(server + '/new'); code = (await r.json()).code; } }
  catch { $('#err').textContent = 'Could not reach the room server.'; return; }
  history.replaceState({}, '', `?room=${code}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : ''));
  $('#codeLabel').textContent = code; $('#bigCode').textContent = code;
  const playBase = location.href.split('?')[0].replace(/online\.html$/, 'play.html').replace(/\/host\/?$/, '/play/');
  const playUrl = playBase + `?room=${code}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : '');
  $('#joinLine').innerHTML = `Join from your phone at <b>${playUrl.replace(/^https?:\/\//, '')}</b> &nbsp;·&nbsp; room code <b>${code}</b> &nbsp;·&nbsp; this screen is view-only`;
  connect();
})();
function connect() {
  ws = new WebSocket(server.replace(/^http/, 'ws') + `/r/${code}/ws?role=screen&name=Screen&pid=${pid}`);
  ws.onopen = () => { $('#connPill').textContent = 'live'; $('#connPill').className = 'pill live'; syncClock(); setInterval(syncClock, 15000); };
  ws.onclose = () => { $('#connPill').textContent = 'reconnecting…'; $('#connPill').className = 'pill'; setTimeout(connect, 1200); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function syncClock() { for (let i = 0; i < 4; i++) setTimeout(() => send({ t: 'ping', c: Date.now() }), i * 120); }

function handle(m) {
  if (m.t === 'pong') { const now = Date.now(), rtt = now - m.c; if (rtt < bestRtt) { bestRtt = rtt; offset = m.s + rtt / 2 - now; } return; }
  if (m.t === 'welcome' || m.t === 'state') { players = m.state.players; settings = m.state.settings || {}; renderPlayers(); renderSetup(); return; }
  if (m.t === 'config') { settings = { ...settings, ...m.settings }; renderSetup(); return; }
  if (m.t === 'players') { players = m.players; renderPlayers(); return; }
  if (m.t === 'board') return onBoard(m);
  if (m.t === 'wager') { setMood('happy'); bubble(`${m.name} found a Double Down! Wagering up to ${m.max}.`); return; }
  if (m.t === 'wagered') { bubble(`${m.name} wagers ${m.amount}.`); return; }
  if (m.t === 'question') return onQuestion(m);
  if (m.t === 'buzzing') { highlight = m.id; renderPlayers(); bubble(`${m.name} is buzzing in…`); return; }
  if (m.t === 'locked') { highlight = m.id; renderPlayers(); stopTimer(); setMood('neutral'); bubble(`${m.name} is answering.`); return; }
  if (m.t === 'wrong') { players = m.scores; highlight = null; renderPlayers(); setMood('sad'); bubble(`${m.name} got it wrong. ${m.delta} points.`); return; }
  if (m.t === 'reopen') { deadline = m.deadline; startTimer(); setMood('neutral'); bubble('Open to everyone else — buzz in!'); return; }
  if (m.t === 'reveal') return onReveal(m);
  if (m.t === 'over') return onOver(m);
  if (m.t === 'error') { $('#err').textContent = m.msg; return; }
}
function show(view) {
  $('#lobbyPanel').classList.toggle('hide', view !== 'lobby');
  $('#panel').classList.toggle('hide', view !== 'question');
  $('#bgrid').classList.toggle('hide', view !== 'board');
  $('#turnline').classList.toggle('hide', view !== 'board');
  if (view !== 'question') { $('#fuse').classList.add('hide'); stopTimer(); }
}
function renderSetup() {
  const board = settings.mode === 'board';
  const tags = [board ? 'Board' : 'Buzz-In'];
  if (board) tags.push(settings.boardSize === 'quick' ? '15 tiles' : '25 tiles');
  else tags.push(`${settings.rounds || 10} questions`, settings.difficulty === 'any' || !settings.difficulty ? 'Mixed' : settings.difficulty);
  if (settings.timer) tags.push(`${settings.timer / 1000}s to buzz`);
  if (settings.answerMs) tags.push(`${settings.answerMs / 1000}s to answer`);
  const box = $('#setupTags'); box.textContent = '';
  tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; box.appendChild(s); });
}
function onBoard(m) {
  show('board');
  $('#phasePill').textContent = 'Board';
  turnId = m.turn; highlight = null;
  const grid = $('#bgrid'); grid.textContent = '';
  grid.style.gridTemplateColumns = `repeat(${m.board.cats.length}, 1fr)`;
  m.board.cats.forEach(c => { const d = document.createElement('div'); d.className = 'bcat'; d.textContent = c.replace(/^(Entertainment|Science): /, ''); grid.appendChild(d); });
  m.board.grid.forEach(row => row.forEach(t => { const d = document.createElement('div'); d.className = 'btile' + (t.done ? ' done' : ''); d.textContent = t.done ? '' : t.value; grid.appendChild(d); }));
  $('#turnline').textContent = `${m.turnName} is picking…`;
  setMood('neutral'); bubble(`${m.turnName}, pick a tile.`);
  if (m.scores) { players = m.scores; renderPlayers(); }
}
function onQuestion(m) {
  show('question');
  turnId = null; highlight = m.owner || null;
  $('#phasePill').textContent = m.mode === 'board'
    ? `${m.ownerName}'s tile for ${m.value}${m.dd ? ' · Double Down' : ''}`
    : `Question ${m.round}${m.rounds ? ' of ' + m.rounds : ''}`;
  $('#fact').classList.add('hide');
  const q = m.question;
  $('#chips').textContent = '';
  [[q.category, ''], [q.difficulty[0].toUpperCase() + q.difficulty.slice(1), q.difficulty]].forEach(([txt, cls]) => {
    const s = document.createElement('span'); s.className = 'chip ' + cls; s.textContent = txt; $('#chips').appendChild(s);
  });
  $('#qtext').textContent = q.text;
  $('#qtext').className = 'qtext' + (q.text.length > 110 ? ' small' : '');
  const box = $('#opts'); box.textContent = '';
  q.options.forEach((o, i) => {
    const d = document.createElement('div'); d.className = 'opt';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = LETTERS[i];
    const t = document.createElement('span'); t.textContent = o;
    d.append(k, t); box.appendChild(d);
  });
  renderPlayers();
  setMood('neutral');
  bubble(m.mode === 'board' ? `${m.ownerName}'s question for ${m.value}.` : 'Buzz in when you know it!');
  shownAt = m.shownAt; deadline = m.deadline;
  setTimeout(() => { $('#fuse').classList.remove('hide'); startTimer(); }, Math.max(0, shownAt - roomNow()));
}
function startTimer() {
  stopTimer();
  const span = Math.max(1, deadline - roomNow());
  timerId = setInterval(() => {
    const left = deadline - roomNow(), f = Math.max(0, Math.min(1, left / span));
    $('#fuseFill').style.width = (f * 100) + '%';
    $('#fuse').className = 'fuse' + (left <= 5000 ? ' danger' : left <= 10000 ? ' warn' : '');
    if (left <= 0) stopTimer();
  }, 80);
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function onReveal(m) {
  stopTimer(); $('#fuse').classList.add('hide');
  [...document.querySelectorAll('.opt')].forEach((o, i) => { if (i === m.correctIdx) o.classList.add('right'); });
  players = m.scores; highlight = m.winner ? m.winner.id : null; renderPlayers();
  setMood(m.winner ? 'happy' : 'sad');
  bubble(m.winner ? `${m.winner.name} got it, plus ${m.winner.delta}.` : `Nobody got it. The answer was ${m.correct}.`);
  if (m.explain) {
    const f = $('#fact'); f.classList.remove('hide'); f.textContent = '';
    const b = document.createElement('b'); b.textContent = `Why it's ${m.correct}`;
    const p = document.createElement('div'); p.textContent = m.explain;
    f.append(b, p);
    if (m.source?.url) { const a = document.createElement('a'); a.href = m.source.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = `Wikipedia: ${m.source.title} (CC BY-SA)`; f.append(a); }
  }
}
function onOver(m) {
  stopTimer(); show('lobby');
  players = m.scores; highlight = null; renderPlayers();
  const top = m.scores[0];
  $('#phasePill').textContent = 'Final scores';
  $('#lobbyText').textContent = top ? `${top.name} wins with ${top.score} points! Set up another game from your device.` : 'Game over.';
  setMood('happy');
  bubble(top ? `${top.name} wins with ${top.score} points!` : 'That is the end of the game.');
}
function renderPlayers() {
  const box = $('#players'); box.textContent = '';
  players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'prow' + (p.id === highlight ? ' buzzed' : '') + (p.id === turnId ? ' turn' : '') + (p.connected ? '' : ' out');
    const n = document.createElement('span'); n.textContent = p.name;
    const s = document.createElement('span'); s.className = 's' + (p.score < 0 ? ' neg' : ''); s.textContent = p.score;
    row.append(n, s); box.appendChild(row);
  });
  if (!players.length) box.innerHTML = '<div class="prow" style="opacity:.6">Waiting for players…</div>';
}
</script>
</body>
</html>
