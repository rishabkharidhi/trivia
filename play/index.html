<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Push to Think — Buzzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<style>
:root{
  --lob-1:#3b1063;--lob-2:#1d0a3d;--lob-edge:#7b3fe4;--lob-card:#2e1156;--lob-accent:#39e6c3;
  --studio:#2a1355;--studio-2:#3b2170;--edge:#8357d6;--marquee:#ffc53d;--hot:#ff5fae;--go:#1fd6a8;--bust:#ff5a4e;--paper:#f6f3ff;--muted:#aab0e8;--ink:#141747}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 80% 60% at 50% 0%,#5b34a8,#2a1355 60%,#150a2e);color:var(--paper);font-family:'Rubik',system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .4s}
body.lobby{background:radial-gradient(ellipse 90% 60% at 50% 0%,var(--lob-1),var(--lob-2) 65%,#120626)}
body.lobby .card{background:linear-gradient(180deg,var(--lob-card),#230c45);box-shadow:inset 0 0 0 2px var(--lob-edge)}
body.lobby .pill{background:var(--lob-card);border-color:var(--lob-edge)}
body.lobby .btn.ghost{background:var(--lob-card);box-shadow:inset 0 0 0 2px var(--lob-edge)}
.btn.go{background:var(--lob-accent);color:#08251f}
.roomcode{font-size:34px;font-weight:900;letter-spacing:10px;color:var(--lob-accent)}
.modes{display:grid;gap:10px}
.modecard{text-align:left;border:3px solid var(--lob-edge);border-radius:18px;background:rgba(255,255,255,.04);padding:14px;width:100%;color:inherit}
.modecard[aria-pressed="true"]{border-color:var(--lob-accent);background:rgba(57,230,195,.12)}
.modecard b{display:block;font-size:19px;margin-bottom:3px}
.modecard small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.sectitle{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.readout{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:16px}
.prow.me{background:rgba(57,230,195,.16);font-weight:700}
.prow .badge{font-size:11px;color:var(--lob-accent);font-weight:700}
.roomline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.gamebar b{color:var(--marquee);letter-spacing:3px}
.muted{color:var(--muted);font-size:14px}
body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--studio-2);border:2px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.pill.live{border-color:var(--go)} .pill.dead{border-color:var(--bust)}
.card{background:linear-gradient(180deg,var(--studio-2),#2b1859);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 2px var(--edge)}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input{width:100%;font:700 22px inherit;color:var(--paper);background:var(--ink);border:3px solid var(--edge);border-radius:14px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--marquee)}
#code{text-transform:uppercase;letter-spacing:6px;text-align:center}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;background:var(--marquee);color:var(--ink)}
.btn.ghost{background:var(--studio-2);color:var(--paper);box-shadow:inset 0 0 0 2px var(--edge)}
.question{font-size:20px;line-height:1.3;font-weight:700;margin:0 0 4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(246,243,255,.12)}
.chip.easy{background:var(--go);color:var(--ink)}.chip.medium{background:var(--marquee);color:var(--ink)}.chip.hard{background:var(--hot)}
#buzz{flex:none;height:112px;width:min(320px,100%);border:0;border-radius:28px;background:radial-gradient(circle at 50% 30%,#ff8a7a,#e03131 58%,#9c1c1c);color:#fff;font-size:30px;font-weight:900;letter-spacing:.04em;box-shadow:0 8px 0 #6d1212,0 18px 40px rgba(255,61,139,.35);transition:transform .06s,box-shadow .06s,filter .2s}
#buzz:active:not(:disabled){transform:translateY(8px);box-shadow:0 2px 0 #6d1212}
#buzz:disabled{filter:grayscale(.7) brightness(.6);box-shadow:0 5px 0 #4a1212}
#buzz small{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:8px;letter-spacing:0}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.buzzrow{display:flex;justify-content:center}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--edge);border-radius:16px;background:var(--studio-2);padding:14px;font-size:18px;font-weight:700;width:100%}
.opt .k{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft,#b79cff);color:var(--ink);display:grid;place-items:center;font-weight:900}
.opt.right{background:var(--go);color:var(--ink);border-color:#aff5e3}
.opt.wrong{background:var(--bust);border-color:#ffb3ad}
.opt:disabled{opacity:.55}
.status{font-size:16px;color:var(--muted);text-align:center;min-height:22px}
.big{font-size:26px;font-weight:800;text-align:center;margin:8px 0}
.scores{display:flex;flex-direction:column;gap:6px;font-size:15px}
.srow{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:rgba(246,243,255,.06)}
.srow.me{background:rgba(255,197,61,.18);font-weight:700}
.hide{display:none!important}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.setgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin:0}
.setgrid select{font:600 15px inherit;color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:8px}
/* board */
.bgrid{display:grid;gap:6px}
.bcat{font-size:11px;font-weight:700;text-align:center;line-height:1.1;padding:4px 2px;border-radius:8px;background:#43106b;box-shadow:inset 0 0 0 2px var(--hot);min-height:34px;display:grid;place-items:center}
.btile{border:2px solid var(--edge);border-radius:10px;background:var(--studio-2);color:var(--marquee);font-weight:800;font-size:15px;padding:12px 2px}
.btile:disabled{opacity:.25}
.btile.mine:not(:disabled){box-shadow:0 0 0 2px var(--marquee)}
.wagerbox{display:flex;gap:8px;margin-top:10px}
.wagerbox input{flex:1;margin:0;font-size:20px;text-align:center}
.owner{font-size:15px;color:var(--marquee);font-weight:700;text-align:center;margin-top:6px}
.err{color:var(--bust);font-weight:700;font-size:14px;min-height:20px}
#telly .qm-bob,#telly .qm-pose,#telly .shape-bang,#telly .eyes,#telly .qm-dot{transform-box:view-box}
#telly .shape-bang,#telly .e-happy,#telly .e-sad,#telly .e-wide,#telly .m-grin,#telly .m-frown,#telly .m-o,#telly .m-talk,#telly .drops{display:none}
#host.mood-happy .shape-q{display:none}
#host.mood-happy .shape-bang{display:inline;transform-origin:120px 190px;animation:bang .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bang{from{transform:scale(.6,.4)}to{transform:scale(1)}}
#host.mood-happy .e-open{display:none} #host.mood-happy .e-happy{display:inline}
#host.mood-happy .m-smile{display:none} #host.mood-happy .m-grin{display:inline}
#host.mood-sad .e-open{display:none} #host.mood-sad .e-sad{display:inline}
#host.mood-sad .m-smile{display:none} #host.mood-sad .m-frown{display:inline}
#host.mood-sad .qm-pose{transform-origin:120px 230px;transform:rotate(-16deg) translate(-8px,16px) scaleY(.92);transition:transform .45s ease}
#host.mood-confused .e-open{display:none} #host.mood-confused .e-wide{display:inline}
#host.mood-confused .m-smile{display:none} #host.mood-confused .m-o{display:inline}
#host.mood-confused .qm-pose{transform-origin:120px 230px;animation:tilt 1.1s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#telly .qm-pose{transition:transform .35s ease}
#host.talking .m-smile,#host.talking .m-grin,#host.talking .m-frown,#host.talking .m-o{display:none}
#host.talking .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:yap .17s ease-in-out infinite alternate}
#host.talking .qm-bob{animation:bob .34s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes yap{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#telly .eyes{transform-origin:120px 48px;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#telly .qm-dot{transform-origin:120px 276px}
#host.talking .qm-dot{animation:squish .34s ease-in-out infinite alternate}
@keyframes squish{from{transform:scale(1,1)}to{transform:scale(1.08,.9)}}
#host.sweat .drops{display:inline;animation:drip .6s ease-in infinite}
@keyframes drip{from{transform:translateY(-2px);opacity:1}to{transform:translateY(8px);opacity:.2}}
#host.sweat .qm-bob{animation:jitter .12s linear infinite}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}

/* countdown, same idea as the single-screen fuse */
.timerwrap{display:flex;align-items:center;gap:10px}
.tlabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:54px}
.fuse{flex:1;height:12px;border-radius:6px;background:rgba(247,243,255,.14);overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--soft,#b79cff),#e7ddff);transition:width .1s linear}
.fuse.warn i{background:linear-gradient(90deg,#ff9f1c,var(--marquee))}
.fuse.danger i{background:linear-gradient(90deg,var(--bust),#ff9c9c)}
.secs{font-weight:800;font-size:19px;min-width:38px;text-align:right}
.secs.warn{color:var(--marquee)} .secs.danger{color:var(--bust)}
/* the host, small on phones and full size in the side rail */
#hostbox{display:flex;align-items:center;gap:12px}
#telly.mini{height:86px;width:auto;flex:none}
#bubble{flex:1;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.35;font-weight:500}
#bubble .who{display:block;font-size:11px;font-weight:700;color:var(--hot);margin-bottom:2px}
/* wide screens: main column plus a right rail for the host and scores */
@media (min-width: 900px){
  body{max-width:none;margin:0;padding-left:24px;padding-right:24px;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"top rail" "main rail";gap:20px;align-content:start}
  .opt{font-size:19px;padding:16px}
  .question{font-size:24px}
  .top{grid-area:top}
  #landing,#lobby,#playArea{grid-area:main}
  #rail{grid-area:rail;display:flex;flex-direction:column;gap:12px}
  #telly.mini{height:150px}
  #hostbox{flex-direction:column;align-items:stretch}
  #bubble{font-size:16px;min-height:70px}
  #buzz{height:120px;width:min(360px,100%);font-size:32px}
  .opts{grid-template-columns:1fr 1fr}
}
@media (max-width: 899px){ #rail{display:contents} }
</style>
</head>
<body>
<div class="top">
  <h1>Push to Think</h1>
  <span class="pill" id="conn">offline</span>
</div>

<!-- 1. landing -->
<section id="landing">
  <div class="card">
    <label for="name">Your name</label>
    <input id="name" maxlength="16" autocomplete="nickname" placeholder="Rishab">
    <button class="btn" id="createBtn">Create a room</button>
    <p class="muted" style="text-align:center;margin:14px 0 8px">or join one</p>
    <label for="code">Room code</label>
    <input id="code" maxlength="6" autocomplete="off" placeholder="ABCD">
    <button class="btn ghost" id="joinBtn">Join</button>
    <div class="err" id="joinErr"></div>
  </div>
</section>

<!-- 2. lobby -->
<section id="lobby" class="hide" style="display:flex;flex-direction:column;gap:12px">
  <div class="card">
    <div class="roomline">
      <div><p class="sectitle" style="margin:0">Room code</p><div class="roomcode" id="roomCode"></div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn ghost" id="copyBtn" style="padding:9px 14px;font-size:14px;white-space:nowrap">Copy invite</button>
        <button class="btn ghost" id="screenBtn" style="padding:9px 14px;font-size:14px;white-space:nowrap">Big screen</button>
      </div>
    </div>
  </div>
  <div class="card" id="modeCard">
    <p class="sectitle">Game mode</p>
    <div class="modes">
      <button class="modecard" data-mode="buzz" aria-pressed="true"><b>Buzz-In</b><small>Everyone races to buzz. A wrong answer opens the question to the rest.</small></button>
      <button class="modecard" data-mode="board" aria-pressed="false"><b>Board</b><small>Take turns picking category tiles for points. Miss it and the others can steal.</small></button>
      <button class="modecard" data-mode="survival" aria-pressed="false"><b>Survival</b><small>Everyone gets lives. Each round shares one category, and a wrong answer costs a life. Last one standing wins.</small></button>
    </div>
  </div>
  <div class="card" id="setCard">
    <p class="sectitle">Settings</p>
    <div class="setgrid">
      <label class="buzz-only">Questions<select id="rounds"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="30">30</option></select></label>
      <label class="surv-only hide">Lives each<select id="lives"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="5">5</option></select></label>
      <label class="board-only hide">Board size<select id="boardSize"><option value="full">Full, 25 tiles</option><option value="quick">Quick, 15 tiles</option></select></label>
      <label class="buzz-only">Difficulty<select id="difficulty"><option value="any">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
      <label>Buzz window<select id="timer"><option value="10000">10 sec</option><option value="15000">15 sec</option><option value="20000" selected>20 sec</option><option value="30000">30 sec</option></select></label>
      <label>Answer time<select id="answerMs"><option value="5000">5 sec</option><option value="7000" selected>7 sec</option><option value="10000">10 sec</option><option value="15000">15 sec</option><option value="20000">20 sec</option><option value="30000">30 sec</option></select></label>
      <label>Next question<select id="autoNext"><option value="1" selected>Automatic</option><option value="0">I press next</option></select></label>
    </div>
  </div>
  <div class="card hide" id="readCard">
    <p class="sectitle">Setup</p>
    <div class="readout" id="readout"></div>
  </div>
  <div class="card">
    <p class="sectitle">Players</p>
    <div class="plist" id="lobbyPlayers"></div>
  </div>
  <button class="btn go" id="startBtn">Start the game</button>
  <p class="status" id="lobbyNote"></p>
</section>

<!-- 3. game -->
<section id="playArea" class="hide" style="display:flex;flex-direction:column;gap:12px;flex:1">
  <div class="gamebar">
    <span>Room <b id="gameCode"></b></span>
    <span id="gameMode"></span>
    <span style="display:flex;gap:6px">
      <button class="btn ghost hide" id="nextBtn" style="width:auto;padding:7px 12px;font-size:13px">Next</button>
      <button class="btn ghost hide" id="endBtn" style="width:auto;padding:7px 12px;font-size:13px">End</button>
    </span>
  </div>
  <div class="card hide" id="boardCard">
    <p class="question" id="boardTitle" style="font-size:17px">Board</p>
    <div class="bgrid" id="bgrid"></div>
    <div class="owner" id="boardTurn"></div>
    <div class="wagerbox hide" id="wagerBox">
      <input id="wagerIn" type="number" inputmode="numeric" placeholder="0">
      <button class="btn" id="wagerBtn" style="width:auto;padding:10px 16px">Wager</button>
    </div>
  </div>
  <div class="card" id="qCard">
    <div class="timerwrap" id="timerRow" style="margin-bottom:10px"><span class="tlabel" id="timerLabel">Buzz</span><div class="fuse" id="fuse"><i id="fuseFill"></i></div><span class="secs" id="secs">20</span></div>
    <div class="meta" id="meta"></div>
    <p class="question" id="qText">Waiting to start…</p>
    <div class="owner hide" id="qOwner"></div>
  </div>
  <div class="opts hide" id="opts"></div>
  <div class="buzzrow"><button id="buzz" disabled>BUZZ<small id="buzzSub">waiting…</small></button></div>
  <div class="status" id="status"></div>
</section>

<aside id="rail">
  <div class="card" id="hostCard"><div id="hostbox"><div id="host" class="mood-neutral"><svg id="telly" class="mini" viewBox="0 0 240 300" role="img" aria-label="Fae N'Lancer, the game host">
      <ellipse class="shadow" cx="120" cy="288" rx="34" ry="7" fill="#070930" opacity=".5"/>
      <g class="qm-bob"><g class="qm-pose">
        <g class="shape-q">
          <path d="M68 100 C68 38 172 38 172 100 C172 140 120 140 120 185" fill="none" stroke="#c4175e" stroke-width="54" stroke-linecap="round"/>
          <path d="M68 100 C68 38 172 38 172 100 C172 140 120 140 120 185" fill="none" stroke="#ff3d8b" stroke-width="44" stroke-linecap="round"/>
          <path d="M80 82 C88 56 116 46 140 50" fill="none" stroke="#ffd1e4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        </g>
        <g class="shape-bang">
          <rect x="82" y="18" width="76" height="176" rx="38" fill="#c4175e"/>
          <rect x="87" y="23" width="66" height="166" rx="33" fill="#ff3d8b"/>
          <path d="M98 40 L98 100" stroke="#ffd1e4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        </g>
        <g class="face" transform="translate(120 56) scale(1.22) translate(-120 -56)">
          <g class="eyes">
            <g class="e-open"><ellipse cx="108" cy="48" rx="6.5" ry="8.5" fill="#141747"/><ellipse cx="132" cy="48" rx="6.5" ry="8.5" fill="#141747"/><circle cx="110" cy="45" r="2.2" fill="#fff"/><circle cx="134" cy="45" r="2.2" fill="#fff"/></g>
            <g class="e-happy"><path d="M101 51 Q108 40 115 51" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M125 51 Q132 40 139 51" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>
            <g class="e-sad"><path d="M101 46 Q108 54 115 48" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M125 48 Q132 54 139 46" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>
            <g class="e-wide"><circle cx="107" cy="47" r="9" fill="#fff"/><circle cx="133" cy="47" r="9" fill="#fff"/><circle cx="107" cy="47" r="3.5" fill="#141747"/><circle cx="133" cy="47" r="3.5" fill="#141747"/></g>
          </g>
          <path class="m-smile" d="M110 63 Q120 73 130 63" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path class="m-grin" d="M107 61 Q120 80 133 61 Z" fill="#141747"/>
          <path class="m-frown" d="M110 70 Q120 61 130 70" stroke="#141747" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <ellipse class="m-o" cx="120" cy="67" rx="5" ry="6.5" fill="#141747"/>
          <ellipse class="m-talk" cx="120" cy="66" rx="8" ry="6" fill="#141747"/>
          <g class="drops"><path d="M150 36 q5 8 0 12 q-5 -4 0 -12z" fill="#9fd8ff"/><path d="M88 56 q4 7 0 10 q-4 -3 0 -10z" fill="#9fd8ff"/></g>
        </g>
        <g class="bowtie"><path d="M120 178 L100 168 L100 190 Z M120 178 L140 168 L140 190 Z" fill="#ffc53d"/><circle cx="120" cy="179" r="5" fill="#e0a520"/></g>
      </g></g>
      <g class="qm-dot"><circle cx="120" cy="252" r="24" fill="#c4175e"/><circle cx="120" cy="252" r="19" fill="#ff3d8b"/><circle cx="113" cy="245" r="5" fill="#ffd1e4" opacity=".7"/></g>
    </svg></div><div id="bubble"><span class="who">Fae N'Lancer</span><span id="bubbleText">Waiting to start…</span></div></div></div>
  <div class="card"><p class="sectitle">Scores</p><div class="scores" id="scores"></div></div>
</aside>

<script type="module">
// Point this at your deployed Worker, or pass ?server=... in the URL.
const DEFAULT_SERVER = 'https://push-to-think.rishab-kharidhi.workers.dev';
const qs = new URLSearchParams(location.search);
const server = (qs.get('server') || localStorage.getItem('ptt.server') || DEFAULT_SERVER).replace(/\/$/, '');
if (qs.get('server')) localStorage.setItem('ptt.server', qs.get('server'));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LETTERS = ['A', 'B', 'C', 'D'];

let ws = null, pid = localStorage.getItem('ptt.pid') || '', me = null, roomCode = '', controllerId = null;
let amController = false, mode = 'buzz', myTurn = false, answered = false, myTile = false;
let offset = 0, bestRtt = Infinity, shownAt = 0, deadline = 0, players = [], timerId = null;
let settings = { mode: 'buzz', rounds: 10, difficulty: 'any', boardSize: 'full', lives: 3, timer: 20000, answerMs: 7000, autoNext: true };

$('#name').value = localStorage.getItem('ptt.name') || '';
$('#code').value = (qs.get('room') || '').toUpperCase();

function show(which) {
  $('#landing').classList.toggle('hide', which !== 'landing');
  $('#lobby').classList.toggle('hide', which !== 'lobby');
  $('#playArea').classList.toggle('hide', which !== 'game');
  document.body.classList.toggle('lobby', which === 'lobby');
}

/* ---------- connect ---------- */
$('#joinBtn').onclick = () => join();
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('#createBtn').onclick = async () => {
  const name = $('#name').value.trim();
  if (!name) return ($('#joinErr').textContent = 'Enter a name first.');
  $('#joinErr').textContent = 'Creating a room…';
  try { const r = await fetch(server + '/new'); $('#joinErr').textContent = ''; join((await r.json()).code); }
  catch { $('#joinErr').textContent = 'Could not reach the room server.'; }
};
function join(forced) {
  const name = $('#name').value.trim(), code = (forced || $('#code').value).trim().toUpperCase();
  if (!name) return ($('#joinErr').textContent = 'Enter a name.');
  if (!/^[A-Z0-9]{3,6}$/.test(code)) return ($('#joinErr').textContent = 'Room codes look like ABCD.');
  localStorage.setItem('ptt.name', name);
  if (!pid) { pid = Math.random().toString(36).slice(2, 10); localStorage.setItem('ptt.pid', pid); }
  connect(code, name);
}
function connect(code, name) {
  roomCode = code;
  $('#roomCode').textContent = code; $('#gameCode').textContent = code;
  setConn('connecting…');
  ws = new WebSocket(server.replace(/^http/, 'ws') + `/r/${code}/ws?role=player&name=${encodeURIComponent(name)}&pid=${pid}`);
  ws.onopen = () => { setConn('connected', true); show('lobby'); syncClock(); setInterval(syncClock, 15000); };
  ws.onclose = () => { setConn('reconnecting…', false, true); setTimeout(() => connect(code, name), 1200); };
  ws.onerror = () => { $('#joinErr').textContent = 'Could not reach the room server.'; };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify(o));
function setConn(t, live, dead) { const c = $('#conn'); c.textContent = t; c.className = 'pill' + (live ? ' live' : dead ? ' dead' : ''); }
function syncClock() { for (let i = 0; i < 4; i++) setTimeout(() => send({ t: 'ping', c: Date.now() }), i * 120); }
const roomNow = () => Date.now() + offset;

function setMood(m) { const h = $('#host'); if (h) h.className = 'mood-' + m; }
function bubble(t) { const b = $('#bubbleText'); if (b) b.textContent = t; }
function startTimer(label) {
  stopTimer();
  if (label) $('#timerLabel').textContent = label;
  $('#timerRow').classList.remove('hide');
  const span = Math.max(1, deadline - Math.max(shownAt, roomNow()));
  timerId = setInterval(() => {
    const left = deadline - roomNow();
    const frac = Math.max(0, Math.min(1, left / span));
    $('#fuseFill').style.width = (frac * 100) + '%';
    const secs = Math.max(0, Math.ceil(left / 1000));
    $('#secs').textContent = secs;
    const cls = left <= 5000 ? 'danger' : left <= 10000 ? 'warn' : '';
    $('#fuse').className = 'fuse ' + cls;
    $('#secs').className = 'secs ' + cls;
    if (left <= 0) stopTimer();
  }, 100);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

/* ---------- lobby ---------- */
$$('.modecard').forEach(b => b.onclick = () => {
  if (!amController) return;
  settings.mode = b.dataset.mode;
  renderLobby();
  send({ t: 'config', settings: { mode: settings.mode } });
});
$$('#setCard select').forEach(sel => sel.onchange = () => {
  if (!amController) return;
  settings = { ...settings, rounds: +$('#rounds').value, difficulty: $('#difficulty').value, boardSize: $('#boardSize').value,
    lives: +$('#lives').value, timer: +$('#timer').value, answerMs: +$('#answerMs').value, autoNext: $('#autoNext').value === '1' };
  send({ t: 'config', settings });
});
$('#startBtn').onclick = () => { if (amController) send({ t: 'start', settings }); };
$('#nextBtn').onclick = () => { if (amController) send({ t: 'next' }); };
$('#endBtn').onclick = () => { if (amController) send({ t: 'end' }); };
$('#wagerBtn').onclick = () => {
  send({ t: 'wager', amount: Math.max(0, Math.round(Number($('#wagerIn').value) || 0)) });
  $('#wagerBox').classList.add('hide');
};
const inviteUrl = () => location.href.split('?')[0] + `?room=${roomCode}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : '');
$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(inviteUrl()); $('#copyBtn').textContent = 'Copied!'; }
  catch { prompt('Invite link:', inviteUrl()); }
  setTimeout(() => $('#copyBtn').textContent = 'Copy invite', 1500);
};
$('#screenBtn').onclick = () => {
  const base = location.href.split('?')[0].replace(/play\.html$/, 'online.html').replace(/\/play\/?$/, '/host/');
  window.open(base + `?room=${roomCode}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : ''), '_blank', 'noopener');
};

function renderLobby() {
  const board = settings.mode === 'board', surv = settings.mode === 'survival';
  $$('.modecard').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === settings.mode)));
  $$('.buzz-only').forEach(e => e.classList.toggle('hide', board || surv));
  $$('.board-only').forEach(e => e.classList.toggle('hide', !board));
  $$('.surv-only').forEach(e => e.classList.toggle('hide', !surv));
  $('#rounds').value = settings.rounds; $('#difficulty').value = settings.difficulty;
  $('#boardSize').value = settings.boardSize; $('#timer').value = settings.timer; $('#lives').value = settings.lives || 3;
  $('#answerMs').value = settings.answerMs; $('#autoNext').value = settings.autoNext ? '1' : '0';
  // only the controller sees controls; everyone else sees the same setup, read-only
  $('#modeCard').classList.toggle('hide', !amController);
  $('#setCard').classList.toggle('hide', !amController);
  $('#readCard').classList.toggle('hide', amController);
  $('#startBtn').classList.toggle('hide', !amController);
  const tags = [board ? 'Board' : surv ? 'Survival' : 'Buzz-In'];
  if (board) tags.push(settings.boardSize === 'quick' ? '15 tiles' : '25 tiles');
  else if (surv) tags.push(`${settings.lives || 3} lives each`);
  else tags.push(`${settings.rounds} questions`, settings.difficulty === 'any' ? 'Mixed' : settings.difficulty);
  if (!surv) tags.push(`${settings.timer / 1000}s to buzz`);
  tags.push(`${settings.answerMs / 1000}s to answer`, settings.autoNext ? 'auto-advance' : 'manual next');
  const box = $('#readout'); box.textContent = '';
  tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; box.appendChild(s); });
  const host = players.find(p => p.id === controllerId);
  if (!$('#lobbyNote').dataset.sticky)
    $('#lobbyNote').textContent = amController
      ? (players.length < 2 ? 'Share the code, then start whenever you like.' : 'Everyone in? Start the game.')
      : `Waiting for ${host ? host.name : 'the room'} to start…`;
  renderLobbyPlayers();
}
function renderLobbyPlayers() {
  const box = $('#lobbyPlayers'); box.textContent = '';
  players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'prow' + (p.id === me ? ' me' : '');
    const n = document.createElement('span'); n.textContent = p.name + (p.connected ? '' : ' (away)');
    const b = document.createElement('span'); b.className = 'badge'; b.textContent = p.id === controllerId ? 'runs the room' : '';
    row.append(n, b); box.appendChild(row);
  });
  if (!players.length) box.innerHTML = '<div class="prow">Waiting for players…</div>';
}

/* ---------- messages ---------- */
function handle(m) {
  if (m.t === 'pong') { const now = Date.now(), rtt = now - m.c; if (rtt < bestRtt) { bestRtt = rtt; offset = m.s + rtt / 2 - now; } return; }
  if (m.t === 'welcome') {
    me = m.pid; controllerId = m.state.controllerId; amController = !!m.controller;
    players = m.state.players; settings = { ...settings, ...m.state.settings };
    renderLobby(); renderScores(players);
    if (m.state.phase !== 'lobby' && m.state.phase !== 'over') enterGame();
    return;
  }
  if (m.t === 'config') { settings = { ...settings, ...m.settings }; renderLobby(); return; }
  if (m.t === 'players') { players = m.players; controllerId = m.controllerId; amController = m.controllerId === me; renderLobby(); renderScores(players); return; }
  if (m.t === 'survival') return onSurvival(m);
  if (m.t === 'board') return onBoard(m);
  if (m.t === 'wager') return onWagerPrompt(m);
  if (m.t === 'wagered') { $('#status').textContent = `${m.name} wagers ${m.amount}.`; return; }
  if (m.t === 'question') return onQuestion(m);
  if (m.t === 'buzzing') { $('#status').textContent = `${m.name} is buzzing…`; bubble(`${m.name} is buzzing in…`); return; }
  if (m.t === 'locked') return onLocked(m);
  if (m.t === 'wrong') { $('#status').textContent = `${m.name} got it wrong (${m.delta}).`; setMood('sad'); bubble(`${m.name} got it wrong. ${m.delta} points.`); renderScores(m.scores); return; }
  if (m.t === 'reopen') return onReopen(m);
  if (m.t === 'reveal') return onReveal(m);
  if (m.t === 'over') return onOver(m);
  if (m.t === 'error') { $('#status').textContent = m.msg; $('#lobbyNote').textContent = m.msg; return; }
}
function enterGame() {
  show('game');
  $('#gameMode').textContent = { board: 'Board', survival: 'Survival' }[settings.mode] || 'Buzz-In';
  $('#nextBtn').classList.toggle('hide', !amController);
  $('#endBtn').classList.toggle('hide', !amController);
  $('#nextBtn').textContent = settings.mode === 'board' ? 'Next tile' : 'Next';
  $('#lobbyNote').dataset.sticky = '';
}

/* ---------- board ---------- */
function onBoard(m) {
  mode = settings.mode = 'board'; enterGame(); stopTimer(); $('#timerRow').classList.add('hide');
  setMood('neutral'); bubble(m.turn === me ? 'Your pick — choose a tile.' : `${m.turnName} is picking…`);
  $('#boardCard').classList.remove('hide'); $('#qCard').classList.add('hide');
  $('#buzz').classList.add('hide'); $('#opts').classList.add('hide'); $('#wagerBox').classList.add('hide');
  myTile = m.turn === me;
  $('#boardTurn').textContent = myTile ? 'Your pick — tap a tile' : `${m.turnName} is picking…`;
  const grid = $('#bgrid'); grid.textContent = '';
  grid.style.gridTemplateColumns = `repeat(${m.board.cats.length}, 1fr)`;
  m.board.cats.forEach(c => { const d = document.createElement('div'); d.className = 'bcat'; d.textContent = c.replace(/^(Entertainment|Science): /, ''); grid.appendChild(d); });
  m.board.grid.forEach((row, r) => row.forEach((t, c) => {
    const b = document.createElement('button');
    b.className = 'btile' + (myTile && !t.done ? ' mine' : '');
    b.textContent = t.done ? '' : t.value;
    b.disabled = t.done || !myTile;
    b.onclick = () => { if (myTile && !t.done) { send({ t: 'pick', r, c }); myTile = false; $('#boardTurn').textContent = 'Loading…'; } };
    grid.appendChild(b);
  }));
  if (m.scores) renderScores(m.scores);
  $('#status').textContent = '';
}
function onWagerPrompt(m) {
  $('#status').textContent = `${m.name} found a Double Down!`;
  if (m.id !== me) return;
  $('#wagerBox').classList.remove('hide');
  $('#wagerIn').value = ''; $('#wagerIn').max = m.max; $('#wagerIn').placeholder = `0 to ${m.max}`;
  $('#wagerIn').focus();
}

function onSurvival(m) {
  settings.mode = 'survival'; mode = 'survival'; enterGame();
  $('#boardCard').classList.add('hide'); $('#qCard').classList.remove('hide');
  setMood('neutral');
  bubble(`Round ${m.round}: ${m.category.replace(/^(Entertainment|Science): /, '')}, ${m.difficulty}. ${m.turnName} is up.`);
  renderScores(m.scores);
}

/* ---------- questions ---------- */
function onQuestion(m) {
  answered = false; myTurn = false;
  mode = m.mode || 'buzz';        // buzz | board | survival
  enterGame();
  $('#boardCard').classList.add('hide'); $('#qCard').classList.remove('hide');
  $('#qOwner').classList.toggle('hide', mode === 'buzz');
  if (mode === 'board') $('#qOwner').textContent = `${m.ownerName}'s tile${m.dd ? ' — Double Down' : ''} for ${m.value}`;
  if (mode === 'survival') { $('#qOwner').classList.remove('hide'); $('#qOwner').textContent = `${m.ownerName}'s question`; }
  shownAt = m.shownAt; deadline = m.deadline;
  const q = m.question, meta = $('#meta');
  meta.textContent = '';
  [[q.category, ''], [q.difficulty[0].toUpperCase() + q.difficulty.slice(1), q.difficulty], m.round ? [`Q${m.round}${m.rounds ? ' of ' + m.rounds : ''}`, ''] : null]
    .filter(Boolean).forEach(([txt, cls]) => { const s = document.createElement('span'); s.className = 'chip ' + cls; s.textContent = txt; meta.appendChild(s); });
  $('#qText').textContent = q.text;
  buildOptions(q.options);
  $('#opts').classList.remove('hide');                 // options readable before anyone buzzes
  $('#buzz').classList.toggle('hide', mode !== 'buzz');
  $('#status').textContent = mode === 'buzz' ? 'Read the options, then buzz to lock in.' : '';
  setMood('neutral');
  bubble(mode === 'board' ? `${m.ownerName}'s tile for ${m.value}.`
       : mode === 'survival' ? `${m.ownerName}'s turn.`
       : 'Buzz in when you know it!');
  const turnBased = mode !== 'buzz';
  setTimeout(() => { if (!turnBased || !myTurn) startTimer(turnBased ? 'Answer' : 'Buzz'); }, Math.max(0, shownAt - roomNow()));
  if (!turnBased) armBuzz();
}
function buildOptions(options) {
  const box = $('#opts'); box.textContent = '';
  options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.disabled = true; b.dataset.i = i;
    const k = document.createElement('span'); k.className = 'k'; k.textContent = LETTERS[i];
    const t = document.createElement('span'); t.className = 'txt'; t.textContent = o;
    b.append(k, t); b.onclick = () => answer(i);
    box.appendChild(b);
  });
}
function armBuzz() {
  const b = $('#buzz'), wait = Math.max(0, shownAt - roomNow());
  b.disabled = true; $('#buzzSub').textContent = 'get ready…';
  setTimeout(() => { b.disabled = false; $('#buzzSub').textContent = 'first in wins'; }, wait);
}
$('#buzz').onclick = () => {
  const b = $('#buzz');
  if (b.disabled) return;
  b.disabled = true; $('#buzzSub').textContent = 'buzzed!';
  navigator.vibrate?.(40);
  send({ t: 'buzz', at: roomNow() });      // stamped on this device, converted to room time
};
function onLocked(m) {
  myTurn = m.id === me;
  $('#boardCard').classList.add('hide'); $('#qCard').classList.remove('hide');
  $('#buzz').classList.add('hide'); $('#opts').classList.remove('hide');
  $$('.opt').forEach(o => o.disabled = !myTurn);
  $('#status').textContent = myTurn ? 'Your answer — pick one.' : `${m.name} is answering.`;
  bubble(myTurn
    ? (mode === 'buzz' ? 'You buzzed in! Pick an answer.' : 'Your question — pick an answer.')
    : (mode === 'buzz' ? `${m.name} buzzed in first.` : `${m.name} is answering.`));
  if (m.deadline) { deadline = m.deadline; $('#timerRow').classList.remove('hide'); startTimer('Answer'); }
  else stopTimer();
  if (myTurn) navigator.vibrate?.([30, 60, 30]);
}
function answer(i) {
  if (!myTurn || answered) return;
  answered = true;
  $$('.opt').forEach(o => o.disabled = true);
  $(`.opt[data-i="${i}"]`).style.outline = '3px solid var(--marquee)';
  send({ t: 'answer', idx: i, at: roomNow() });
}
function onReopen(m) {
  deadline = m.deadline; myTurn = false; answered = false;
  setMood('neutral'); bubble('Back open — anyone who has not tried can buzz.'); startTimer('Steal');
  const iTried = (m.tried || []).includes(me);
  $$('.opt').forEach(o => { o.disabled = true; o.style.outline = ''; });
  $('#opts').classList.remove('hide');
  $('#buzz').classList.remove('hide');
  $('#buzz').disabled = iTried;
  $('#buzzSub').textContent = iTried ? 'you already tried' : 'open again!';
  $('#status').textContent = iTried ? 'Someone else can steal this one.' : 'Back open — buzz!';
}
function onReveal(m) {
  $('#boardCard').classList.add('hide'); $('#qCard').classList.remove('hide');
  $('#buzz').classList.add('hide'); $('#opts').classList.remove('hide');
  $$('.opt').forEach((o, i) => { o.disabled = true; o.style.outline = ''; if (i === m.correctIdx) o.classList.add('right'); });
  stopTimer(); $('#timerRow').classList.add('hide');
  $('#status').textContent = m.winner ? `${m.winner.name} got it (+${m.winner.delta})` : `Nobody got it. The answer was ${m.correct}.`;
  setMood(m.winner ? 'happy' : 'sad');
  bubble(m.explain || (m.winner ? `${m.winner.name} got it, plus ${m.winner.delta}.` : `The answer was ${m.correct}.`));
  if (m.explain) $('#qText').textContent = m.explain;
  renderScores(m.scores);
}
function onOver(m) {
  stopTimer(); $('#timerRow').classList.add('hide');
  players = m.scores; renderScores(m.scores);
  const top = m.scores[0];
  setMood('happy'); bubble(top ? `${top.name} wins with ${top.score} points!` : 'Game over.');
  show('lobby');                                  // back to the lobby: settings are editable again
  renderLobby();
  $('#lobbyNote').dataset.sticky = '1';
  $('#lobbyNote').textContent = top ? `${top.name} wins with ${top.score} points! Set up another game.` : 'Game over.';
}
function renderScores(list) {
  const box = $('#scores'); box.textContent = '';
  (list || []).forEach(p => {
    const row = document.createElement('div');
    row.className = 'srow' + (p.id === me ? ' me' : '');
    const hearts = p.lives != null ? (p.out ? ' 💀' : ' ' + '❤️'.repeat(p.lives)) : '';
    const n = document.createElement('span'); n.textContent = p.name + (p.connected ? '' : ' (away)') + hearts;
    const s = document.createElement('span'); s.textContent = p.score;
    row.append(n, s); box.appendChild(row);
  });
}
show('landing');
</script>
</body>
</html>
