<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Push to Think — Buzzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<style>
:root{--studio:#161a52;--studio-2:#232a86;--edge:#4a55d6;--marquee:#ffc53d;--hot:#ff3d8b;--go:#1fd6a8;--bust:#ff5a4e;--paper:#f6f3ff;--muted:#aab0e8;--ink:#141747}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 80% 60% at 50% 0%,#2d35a0,#161a52 60%,#0b0d36);color:var(--paper);font-family:'Rubik',system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--studio-2);border:2px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.pill.live{border-color:var(--go)} .pill.dead{border-color:var(--bust)}
.card{background:linear-gradient(180deg,var(--studio-2),#1a1f6e);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 2px var(--edge)}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input{width:100%;font:700 22px inherit;color:var(--paper);background:var(--ink);border:3px solid var(--edge);border-radius:14px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--marquee)}
#code{text-transform:uppercase;letter-spacing:6px;text-align:center}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;background:var(--marquee);color:var(--ink)}
.btn.ghost{background:var(--studio-2);color:var(--paper);box-shadow:inset 0 0 0 2px var(--edge)}
.question{font-size:20px;line-height:1.3;font-weight:700;margin:0 0 4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(246,243,255,.12)}
.chip.easy{background:var(--go);color:var(--ink)}.chip.medium{background:var(--marquee);color:var(--ink)}.chip.hard{background:var(--hot)}
#buzz{flex:1;min-height:38vh;width:100%;border:0;border-radius:28px;background:radial-gradient(circle at 50% 35%,#ff7ab0,var(--hot) 60%,#c4175e);color:#fff;font-size:42px;font-weight:900;letter-spacing:.04em;box-shadow:0 10px 0 #8d1044,0 18px 40px rgba(255,61,139,.35);transition:transform .06s,box-shadow .06s,filter .2s}
#buzz:active:not(:disabled){transform:translateY(8px);box-shadow:0 2px 0 #8d1044}
#buzz:disabled{filter:grayscale(.7) brightness(.6);box-shadow:0 6px 0 #4a1b31}
#buzz small{display:block;font-size:15px;font-weight:600;opacity:.85;margin-top:8px;letter-spacing:0}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--edge);border-radius:16px;background:var(--studio-2);padding:14px;font-size:18px;font-weight:700;width:100%}
.opt .k{flex:none;width:36px;height:36px;border-radius:50%;background:var(--marquee);color:var(--ink);display:grid;place-items:center;font-weight:900}
.opt.right{background:var(--go);color:var(--ink);border-color:#aff5e3}
.opt.wrong{background:var(--bust);border-color:#ffb3ad}
.opt:disabled{opacity:.55}
.status{font-size:16px;color:var(--muted);text-align:center;min-height:22px}
.big{font-size:26px;font-weight:800;text-align:center;margin:8px 0}
.scores{display:flex;flex-direction:column;gap:6px;font-size:15px}
.srow{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:rgba(246,243,255,.06)}
.srow.me{background:rgba(255,197,61,.18);font-weight:700}
.hide{display:none!important}
.err{color:var(--bust);font-weight:700;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="top">
  <h1>Push to Think</h1>
  <span class="pill" id="conn">offline</span>
</div>

<!-- Join -->
<section id="joinCard" class="card">
  <label for="name">Your name</label>
  <input id="name" maxlength="16" autocomplete="nickname" placeholder="Rishab">
  <label for="code">Room code</label>
  <input id="code" maxlength="6" autocomplete="off" placeholder="ABCD">
  <button class="btn" id="joinBtn">Join the room</button>
  <button class="btn ghost" id="createBtn" style="margin-top:10px">Create a new room</button>
  <div class="err" id="joinErr"></div>
</section>

<!-- Play -->
<section id="playArea" class="hide" style="display:flex;flex-direction:column;gap:12px;flex:1">
  <div class="card" id="roomBar" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px">
    <span style="font-size:15px;color:var(--muted)">Room <b id="roomCode" style="color:var(--marquee);font-size:19px;letter-spacing:3px"></b></span>
    <span style="display:flex;gap:8px">
      <button class="btn ghost" id="copyBtn" style="width:auto;padding:8px 14px;font-size:14px">Copy invite</button>
      <button class="btn ghost" id="screenBtn" style="width:auto;padding:8px 14px;font-size:14px">View big screen</button>
    </span>
  </div>
  <div class="card hide" id="ctrlBar">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <select id="rounds" style="flex:1;font:600 15px inherit;color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:8px"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select>
      <select id="difficulty" style="flex:1;font:600 15px inherit;color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:8px"><option value="any">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
    </div>
    <button class="btn" id="startBtn">Start the round</button>
  </div>
  <div class="card" id="qCard">
    <div class="meta" id="meta"></div>
    <p class="question" id="qText">Waiting to start…</p>
  </div>
  <button id="buzz" disabled>BUZZ<small id="buzzSub">waiting…</small></button>
  <div class="opts hide" id="opts"></div>
  <div class="status" id="status"></div>
  <div class="card"><div class="scores" id="scores"></div></div>
</section>

<script type="module">
// Point this at your deployed Worker, or pass ?server=... in the URL.
const DEFAULT_SERVER = 'https://push-to-think.rishab-kharidhi.workers.dev/';
const qs = new URLSearchParams(location.search);
const server = (qs.get('server') || localStorage.getItem('ptt.server') || DEFAULT_SERVER).replace(/\/$/, '');
if (qs.get('server')) localStorage.setItem('ptt.server', qs.get('server'));
const $ = s => document.querySelector(s);
const LETTERS = ['A', 'B', 'C', 'D'];

let ws = null, pid = localStorage.getItem('ptt.pid') || '', me = null, roomCode = '', amController = false, started = false;
let offset = 0, bestRtt = Infinity;          // clock offset to room time
let state = { phase: 'lobby' }, shownAt = 0, deadline = 0, myTurn = false, answered = false;

$('#name').value = localStorage.getItem('ptt.name') || '';
$('#code').value = (qs.get('room') || localStorage.getItem('ptt.room') || '').toUpperCase();

$('#joinBtn').onclick = () => join();
$('#createBtn').onclick = async () => {
  const name = $('#name').value.trim();
  if (!name) return ($('#joinErr').textContent = 'Enter a name first.');
  $('#joinErr').textContent = 'Creating a room…';
  try {
    const r = await fetch(server + '/new');
    const { code } = await r.json();
    $('#code').value = code; $('#joinErr').textContent = '';
    join(code);
  } catch { $('#joinErr').textContent = 'Could not reach the room server.'; }
};
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

function join(forced) {
  const name = $('#name').value.trim(), code = (forced || $('#code').value).trim().toUpperCase();
  if (!name) return ($('#joinErr').textContent = 'Enter a name.');
  if (!/^[A-Z0-9]{3,6}$/.test(code)) return ($('#joinErr').textContent = 'Room codes look like ABCD.');
  localStorage.setItem('ptt.name', name); localStorage.setItem('ptt.room', code);
  if (!pid) { pid = Math.random().toString(36).slice(2, 10); localStorage.setItem('ptt.pid', pid); }
  connect(code, name);
}

function connect(code, name) {
  roomCode = code;
  $('#roomCode').textContent = code;
  const url = server.replace(/^http/, 'ws') + `/r/${code}/ws?role=player&name=${encodeURIComponent(name)}&pid=${pid}`;
  setConn('connecting…');
  ws = new WebSocket(url);
  ws.onopen = () => {
    setConn('connected', true);
    $('#joinCard').classList.add('hide'); $('#playArea').classList.remove('hide');
    syncClock(); setInterval(syncClock, 15000);
  };
  ws.onclose = () => { setConn('reconnecting…', false, true); setTimeout(() => connect(code, name), 1200); };
  ws.onerror = () => $('#joinErr').textContent = 'Could not reach the room server.';
  ws.onmessage = e => handle(JSON.parse(e.data));
}
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify(o));
function setConn(text, live, dead) { const c = $('#conn'); c.textContent = text; c.className = 'pill' + (live ? ' live' : dead ? ' dead' : ''); }

// --- clock sync: keep the sample with the lowest round trip ---
function syncClock() { for (let i = 0; i < 4; i++) setTimeout(() => send({ t: 'ping', c: Date.now() }), i * 120); }
function onPong(m) {
  const now = Date.now(), rtt = now - m.c;
  if (rtt < bestRtt) { bestRtt = rtt; offset = m.s + rtt / 2 - now; }
}
const roomNow = () => Date.now() + offset;

function handle(m) {
  if (m.t === 'pong') return onPong(m);
  if (m.t === 'welcome') { me = m.pid; state = m.state; setController(m.controller); renderScores(state.players); return applyState(state); }
  if (m.t === 'players') { setController(m.controllerId === me); return renderScores(m.players); }
  if (m.t === 'question') return onQuestion(m);
  if (m.t === 'buzzing') return $('#status').textContent = `${m.name} is buzzing…`;
  if (m.t === 'locked') return onLocked(m);
  if (m.t === 'wrong') return onWrong(m);
  if (m.t === 'reopen') return onReopen(m);
  if (m.t === 'reveal') return onReveal(m);
  if (m.t === 'over') return onOver(m);
  if (m.t === 'error') return $('#status').textContent = m.msg;
}

// Whoever created the room runs it; if they leave, the server hands the controls to someone else.
function setController(yes) {
  amController = !!yes;
  $('#ctrlBar').classList.toggle('hide', !amController);
  $('#startBtn').textContent = started ? 'Next question' : 'Start the round';
}
$('#startBtn').onclick = () => {
  if (!amController) return;
  if (!started) send({ t: 'start', settings: { rounds: +$('#rounds').value, difficulty: $('#difficulty').value, timer: 20000, autoNext: true } });
  else send({ t: 'next' });
};
const inviteUrl = () => location.href.split('?')[0] + `?room=${roomCode}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : '');
$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(inviteUrl()); $('#copyBtn').textContent = 'Copied!'; }
  catch { prompt('Invite link:', inviteUrl()); }
  setTimeout(() => $('#copyBtn').textContent = 'Copy invite', 1500);
};
$('#screenBtn').onclick = () => {
  const url = location.href.replace(/play\.html.*$/, 'online.html').replace(/\/play\/?(\?.*)?$/, '/host/') + `?room=${roomCode}` + (qs.get('server') ? `&server=${encodeURIComponent(qs.get('server'))}` : '');
  window.open(url, '_blank', 'noopener');
};

function applyState(s) {
  if (s.phase === 'question' && s.question) onQuestion({ question: s.question, shownAt: s.shownAt, deadline: s.deadline, round: s.round, rounds: s.settings?.rounds });
  else if (s.phase === 'reveal' && s.lastReveal) onReveal({ ...s.lastReveal, scores: s.players });
}

function onQuestion(m) {
  answered = false; myTurn = false; started = true;
  $('#startBtn').textContent = 'Next question';
  shownAt = m.shownAt; deadline = m.deadline;
  const q = m.question;
  $('#meta').innerHTML = '';
  const chips = [q.category, q.difficulty];
  chips.forEach((c, i) => { const s = document.createElement('span'); s.className = 'chip' + (i ? ' ' + q.difficulty : ''); s.textContent = i ? q.difficulty[0].toUpperCase() + q.difficulty.slice(1) : c; $('#meta').appendChild(s); });
  if (m.round) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = `Q${m.round}${m.rounds ? ' of ' + m.rounds : ''}`; $('#meta').appendChild(s); }
  $('#qText').textContent = q.text;
  buildOptions(q.options);
  $('#opts').classList.add('hide');
  $('#buzz').classList.remove('hide');
  $('#status').textContent = '';
  armBuzz();
}
function buildOptions(options) {
  const box = $('#opts'); box.textContent = '';
  options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.disabled = true; b.dataset.i = i;
    const k = document.createElement('span'); k.className = 'k'; k.textContent = LETTERS[i];
    const t = document.createElement('span'); t.textContent = o;
    b.append(k, t);
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
}
function armBuzz() {
  const b = $('#buzz'), wait = Math.max(0, shownAt - roomNow());
  b.disabled = true; $('#buzzSub').textContent = 'get ready…';
  setTimeout(() => { b.disabled = false; $('#buzzSub').textContent = 'first in wins'; }, wait);
}
$('#buzz').onclick = () => {
  const b = $('#buzz');
  if (b.disabled) return;
  b.disabled = true; $('#buzzSub').textContent = 'buzzed!';
  navigator.vibrate?.(40);
  send({ t: 'buzz', at: roomNow() });      // stamped on this device, converted to room time
};
function onLocked(m) {
  myTurn = m.id === me;
  $('#buzz').classList.add('hide');
  $('#opts').classList.remove('hide');
  [...document.querySelectorAll('.opt')].forEach(o => o.disabled = !myTurn);
  $('#status').textContent = myTurn ? 'You buzzed in! Answer now.' : `${m.name} buzzed in.`;
  if (myTurn) navigator.vibrate?.([30, 60, 30]);
}
function answer(i) {
  if (!myTurn || answered) return;
  answered = true;
  [...document.querySelectorAll('.opt')].forEach(o => o.disabled = true);
  document.querySelector(`.opt[data-i="${i}"]`).style.outline = '3px solid var(--marquee)';
  send({ t: 'answer', idx: i, at: roomNow() });
}
function onWrong(m) {
  $('#status').textContent = `${m.name} got it wrong (${m.delta}).`;
  renderScores(m.scores);
}
function onReopen(m) {
  deadline = m.deadline;
  myTurn = false; answered = false;
  const iTried = (m.tried || []).includes(me);
  $('#opts').classList.add('hide');
  $('#buzz').classList.remove('hide');
  $('#buzz').disabled = iTried;
  $('#buzzSub').textContent = iTried ? 'you already tried' : 'open again!';
  $('#status').textContent = iTried ? 'Someone else can steal this one.' : 'Back open — buzz!';
}
function onReveal(m) {
  $('#buzz').classList.add('hide');
  $('#opts').classList.remove('hide');
  [...document.querySelectorAll('.opt')].forEach((o, i) => {
    o.disabled = true; o.style.outline = '';
    if (i === m.correctIdx) o.classList.add('right');
  });
  $('#status').textContent = m.winner ? `${m.winner.name} got it (+${m.winner.delta})` : `Nobody got it. The answer was ${m.correct}.`;
  if (m.explain) { $('#qText').textContent = m.explain; }
  renderScores(m.scores);
}
function onOver(m) {
  started = false; $('#startBtn').textContent = 'Start the round';
  $('#buzz').classList.add('hide'); $('#opts').classList.add('hide');
  const top = m.scores[0];
  $('#qText').textContent = top ? `${top.name} wins with ${top.score} points!` : 'Game over.';
  $('#status').textContent = 'Waiting for the next round…';
  renderScores(m.scores);
}
function renderScores(players) {
  const box = $('#scores'); box.textContent = '';
  (players || []).forEach(p => {
    const row = document.createElement('div');
    row.className = 'srow' + (p.id === me ? ' me' : '');
    const n = document.createElement('span'); n.textContent = p.name + (p.connected ? '' : ' (away)');
    const s = document.createElement('span'); s.textContent = p.score;
    row.append(n, s); box.appendChild(row);
  });
}
</script>
</body>
</html>
